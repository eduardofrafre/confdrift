name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      # The tool checks its own example: the two overlays must drift.
      - run: |
          if go run . examples/k8s/staging/configmap.yaml examples/k8s/production/configmap.yaml; then exit 1
          else test $? -eq 1; fi
